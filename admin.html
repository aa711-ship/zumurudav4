<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>زمردة — لوحة الإدارة</title><link rel="stylesheet" href="assets/admin.css"></head><body><main class="admin-wrap"><header class="admin-top"><div><small>لوحة الإدارة</small><h1>زمردة 🌸</h1></div><a href="index.html">معاينة المتجر ↗</a></header><section class="admin-grid"><div class="admin-panel"><h2>إضافة / تعديل منتج</h2><form id="productForm"><input type="hidden" id="id"><label>اسم المنتج<input id="name" required></label><label>التصنيف<input id="cat" required placeholder="هدايا"></label><label>السعر<input id="price" type="number" min="0" required></label><label>السعر القديم<input id="old" type="number" min="0"></label><label>الشارة<input id="badge" placeholder="جديد / عرض"></label><label>الوصف<textarea id="desc" rows="3"></textarea></label><label>رابط الصورة<input id="image" type="url" placeholder="https://..."></label><div class="actions"><button type="submit">حفظ المنتج</button><button type="button" id="reset">منتج جديد</button></div></form><p class="warning">هذه لوحة إدارة Frontend مؤقتة. البيانات تُحفظ في هذا المتصفح فقط. <strong>لا تعتبر مصادقة حقيقية ولا تصلح لإدارة متجر متعدد الأجهزة.</strong> الإدارة الحقيقية المشتركة تحتاج Backend/Auth/Database.</p></div><div class="admin-panel"><div class="list-head"><h2>المنتجات</h2><span id="count"></span></div><div id="list"></div></div></section></main><script>
'use strict';
const key='zumurda-products';const defaults=[{id:'pink-gift-box',name:'بوكس هدايا وردي',cat:'هدايا',price:150000,old:180000,badge:'الأكثر طلبًا',desc:'بوكس أنيق قابل للتخصيص.',image:''},{id:'rose-touch',name:'مجموعة لمسة وردية',cat:'مكياجات',price:95000,old:null,badge:'جديد',desc:'مجموعة تجريبية للمظهر الناعم.',image:''},{id:'pearl-set',name:'طقم لؤلؤ زمردة',cat:'اكسسوارات',price:120000,old:145000,badge:'عرض',desc:'إكسسوار ناعم للهدايا والمناسبات.',image:''}];let ps=(()=>{try{return JSON.parse(localStorage.getItem(key))||defaults}catch{return defaults}})();const $=id=>document.getElementById(id),save=()=>localStorage.setItem(key,JSON.stringify(ps));function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function render(){save();$('count').textContent=ps.length+' منتجات';$('list').innerHTML=ps.map(p=>`<article class="admin-product"><div><b>${esc(p.name)}</b><small>${esc(p.cat)} · ${new Intl.NumberFormat('ar-SY').format(p.price)} ل.س</small></div><div><button data-edit="${esc(p.id)}">تعديل</button><button data-delete="${esc(p.id)}">حذف</button></div></article>`).join('')}function clear(){ $('productForm').reset();$('id').value=''}$('productForm').onsubmit=e=>{e.preventDefault();const id=$('id').value||$('name').value.trim().toLowerCase().replace(/[^a-z0-900-00]+/g,'-')+'-'+Date.now();const p={id,name:$('name').value.trim(),cat:$('cat').value.trim(),price:Number($('price').value),old:Number($('old').value)||null,badge:$('badge').value.trim(),desc:$('desc').value.trim(),image:$('image').value.trim()};const i=ps.findIndex(x=>x.id===id);if(i>=0)ps[i]=p;else ps.push(p);render();clear()};$('reset').onclick=clear;document.addEventListener('click',e=>{const edit=e.target.dataset.edit,del=e.target.dataset.delete;if(edit){const p=ps.find(x=>x.id===edit);if(!p)return;Object.keys(p).forEach(k=>{if($(k))$(k).value=p[k]??''})}if(del){ps=ps.filter(x=>x.id!==del);render()}});render();
</script></body></html>
